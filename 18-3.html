      position: absolute;
      top: 20px;
      left: 20px;
      padding: 8px 16px;
      color: white;
      text-decoration: none;
      border-radius: 999px;
      background: rgba(255,255,255,.18);
      transition: background .2s;

    main {
      width: min(1180px, calc(100% - 24px));
      margin: 18px auto 40px;

      background: rgba(255,255,255,.96);
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(43, 61, 105, .14);
      overflow-x: auto;
    }
    svg {
      display: block;
      width: 100%;
      min-width: 900px;
      height: auto;
    }

    /* ---------- SVG 内的交互样式 ---------- */
    .syr_node .syr_card {
      transition: stroke-width .18s ease, fill .18s ease;
    }
    .syr_node:hover .syr_card {
      stroke-width: 2.6;
      fill: #f5faff;
    }
    .syr_node:hover .syr_t { fill: #0f1b2e; }
    .syr_node { cursor: default; }
    .syr_loop {
      stroke-dasharray: 7 6;
      animation: syr_dash 1.1s linear infinite;
    }
    @keyframes syr_dash { to { stroke-dashoffset: -26; } }
    .syr_legend_line {
      stroke-dasharray: 7 6;
      animation: syr_dash 1.1s linear infinite;
    }
    footer {
      padding: 22px;
      text-align: center;
      color: #71809a;
      font-size: 14px;
