<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>212 桑英锐</title>
</head>
<body>
    <h2>HTML表单form</h2>
    <form action="http://huanqiuwang.com" name="syr">
        <p>
            用户名:<input type="text" name="username">
        </p>
        <p>
            密码：<input type="password" name="password">
        </p>
        <p>
            性别：<input type="radio" name="sex" value="male">男
            <input type="radio" name="sex" value="female">女
            <input type="radio" name="sex" value="s">保密
        </p>
        <p>
            爱好：<input type="checkbox" name="hobby" value="f">足球
            <input type="checkbox" name="hobby" value="b">篮球
            <input type="checkbox" name="hobby" value="v">排球
        </p>
        <p>
            籍贯：<select name="jiguan"></select>
            <option value="1">北京</option>
            <option value="2">上海</option>
            <option value="3" selected>大连</option>
        </p>
        <p>
            个人简介：<textarea name="jianjie" cols="30" rows="5"></textarea>
        </p>
        <p>
            出生日期：<input type="date" name="birthday">
        </p>
        <p>
            <input type="file" name="file" multiple>
        </p>
        <p>
            <input type="button" value="普通按钮">
            <input type="submit" value="提交按钮">
            <input type="reset" value="重置按钮">
        </p>
    </form>
    <p>
        <button>表单外的按钮</button>
    </p>
</body>
</html>
