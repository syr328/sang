<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桑英锐 - 商品详情</title>
  <link rel="stylesheet" href="font/iconfont.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", sans-serif;
      color: #24324a;
      background: linear-gradient(135deg, #e8f1ff, #fdfbff);
    }
    header {
      position: relative;
      padding: 56px 20px 60px;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #315caa, #2f8fb5);
    }
    header h1 { margin: 0 0 10px; font-size: 32px; }
    header p { margin: 0; opacity: .9; }
    .syr_back {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 8px 16px;
      color: white;
      text-decoration: none;
      border-radius: 999px;
      background: rgba(255,255,255,.18);
      transition: background .2s;
    }
    .syr_back:hover { background: rgba(255,255,255,.3); }
    main {
      width: min(820px, calc(100% - 32px));
      margin: -32px auto 40px;
    }
    section {
      margin-bottom: 22px;
      padding: 26px;
      background: rgba(255,255,255,.94);
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(43, 61, 105, .12);
    }
    h2 {
      margin: 0 0 6px;
      font-size: 20px;
      color: #315caa;
    }
    h2 .iconfont { margin-right: 8px; }
    .syr_api {
      margin: 0 0 20px;
      font-family: Consolas, monospace;
      font-size: 13px;
      color: #71809a;
      word-break: break-all;
    }
    .syr_api b { color: #2f7d6d; }

    /* 加载与错误 */
    .syr_loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 50px 0;
      color: #71809a;
      font-size: 14px;
    }
    .syr_spin {
      width: 38px;
      height: 38px;
      border: 4px solid #dde6f7;
      border-top-color: #315caa;
      border-radius: 50%;
      animation: syr_turn 0.9s linear infinite;
    }
    @keyframes syr_turn { to { transform: rotate(360deg); } }
    .syr_error {
      display: none;
      padding: 24px;
      font-size: 14px;
      line-height: 1.8;
      color: #c05050;
      border-radius: 12px;
      background: #fff5f5;
      border-left: 5px solid #e06c6c;
    }

    /* 详情内容 */
    .syr_detail { display: none; }
    .syr_top {
      display: flex;
      gap: 22px;
    }
    .syr_pic {
      flex: 0 0 300px;
      padding: 12px;
      border: 1px solid #f0f3fa;
      border-radius: 14px;
      background: white;
    }
    .syr_pic img {
      width: 100%;
      height: 240px;
      object-fit: contain;
    }
    .syr_info { flex: 1; min-width: 0; }
    .syr_info h3 {
      margin: 0 0 10px;
      font-size: 21px;
      line-height: 1.5;
      color: #24324a;
    }
    .syr_tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .syr_tag {
      padding: 3px 12px;
      font-size: 12px;
      border-radius: 999px;
    }
    .syr_tag.syr_cat { color: #4a6fc4; background: #eaf1ff; }
    .syr_tag.syr_brand { color: #2f7d6d; background: #e7f6f0; }
    .syr_tag.syr_rate { color: #b36b00; background: #fff3dd; }
    .syr_price_row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 6px;
    }
    .syr_price {
      font-size: 28px;
      font-weight: bold;
      color: #e64a19;
    }
    .syr_old {
      font-size: 14px;
      color: #9aa6bd;
      text-decoration: line-through;
    }
    .syr_discount {
      font-size: 13px;
      font-weight: bold;
      color: white;
      padding: 2px 10px;
      border-radius: 999px;
      background: #ff7043;
    }
    .syr_stock {
      font-size: 13px;
      color: #71809a;
      margin-bottom: 16px;
    }
    .syr_desc {
      font-size: 14px;
      line-height: 2;
      color: #5b6578;
      text-align: justify;
    }
    .syr_actions {
      display: flex;
      gap: 12px;
      margin-top: 22px;
    }
    .syr_btn {
      padding: 10px 22px;
      font-size: 14px;
      color: #315caa;
      text-decoration: none;
      border: 1px solid #c6d5f5;
      border-radius: 999px;
      background: white;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .syr_btn:hover { background: #315caa; color: white; }
    footer {
      padding: 24px;
      text-align: center;
      color: #71809a;
      font-size: 14px;
    }
    @media (max-width: 700px) {
      .syr_top { flex-direction: column; }
      .syr_pic { flex: auto; }
    }
  </style>
</head>
<body>
  <!--
    姓名：桑英锐
    日期：2026-11-02
    使用大模型：GLM-5.3-Flash
    功能名称：商品详情页（根据 URL 中的 id 用 fetch 获取单个商品）
  -->
  <header>
    <a class="syr_back" href="17-3.html"><span class="iconfont icon-fanhui"></span> 返回商品列表</a>
    <h1>商品详情</h1>
    <p>根据地址栏 id 参数，fetch 请求接口获取单个商品</p>
  </header>

  <main>
    <section>
      <h2><span class="iconfont icon-fenlei"></span>商品信息</h2>
      <p class="syr_api" id="syr_api">接口地址：<b>https://dummyjson.com/products/1</b></p>
      <div class="syr_loading" id="syr_loading">
        <div class="syr_spin"></div>
        正在请求接口数据，请稍候...
      </div>
      <div class="syr_error" id="syr_error"></div>
      <div class="syr_detail" id="syr_detail"></div>
    </section>
  </main>

  <footer>© 2026 桑英锐 · 高级网页设计课堂实践</footer>

  <script>
    /* 从地址栏问号参数中取出 id，如 17-3-detail.html?id=3 */
    var syr_params = new URLSearchParams(location.search);
    var syr_id = syr_params.get("id") || "1";   // 没传 id 默认查看 1 号商品

    document.getElementById("syr_api").innerHTML =
      "接口地址：<b>https://dummyjson.com/products/" + syr_id + "</b>";
    document.title = "桑英锐 - 商品详情 #" + syr_id;

    var syr_detail = document.getElementById("syr_detail");
    var syr_loading = document.getElementById("syr_loading");
    var syr_errorEl = document.getElementById("syr_error");

    /* 按 id 请求单个商品 */
    fetch("https://dummyjson.com/products/" + syr_id)
      .then(function (syr_res) {
        if (!syr_res.ok) throw new Error("HTTP 状态码：" + syr_res.status + "（找不到该商品）");
        return syr_res.json();
      })
      .then(function (syr_p) {
        syr_loading.style.display = "none";
        syr_detail.style.display = "block";
        syr_detail.innerHTML =
          '<div class="syr_top">' +
            '<div class="syr_pic"><img src="' + syr_p.thumbnail + '" alt="' + syr_p.title + '"></div>' +
            '<div class="syr_info">' +
              '<h3>' + syr_p.title + '</h3>' +
              '<div class="syr_tags">' +
                '<span class="syr_tag syr_cat">' + syr_p.category + '</span>' +
                '<span class="syr_tag syr_brand">' + (syr_p.brand || "无品牌") + '</span>' +
                '<span class="syr_tag syr_rate">★ ' + syr_p.rating.toFixed(1) + '</span>' +
              '</div>' +
              '<div class="syr_price_row">' +
                '<span class="syr_price">$' + syr_p.price.toFixed(2) + '</span>' +
                '<span class="syr_old">原价 $' + (syr_p.price / (syr_p.discountPercentage / 100 + 1)).toFixed(2) + '</span>' +
                '<span class="syr_discount">-' + Math.round(syr_p.discountPercentage) + '%</span>' +
              '</div>' +
              '<div class="syr_stock">库存 ' + syr_p.stock + ' 件 · 商品编号 #' + syr_p.id + '</div>' +
              '<p class="syr_desc">' + syr_p.description + '</p>' +
            '</div>' +
          '</div>' +
          '<div class="syr_actions">' +
            '<a class="syr_btn" href="17-3.html"><span class="iconfont icon-fanhui"></span> 返回列表</a>' +
            '<a class="syr_btn" href="17-3-detail.html?id=' + (Number(syr_id) % 8 + 1) + '">查看下一件商品 →</a>' +
          '</div>';
      })
      .catch(function (syr_e) {
        syr_loading.style.display = "none";
        syr_errorEl.style.display = "block";
        syr_errorEl.textContent = "请求失败：" + syr_e.message + "\n请检查网络连接后刷新页面重试。";
      });
  </script>
</body>
</html>
