<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        ul{
            list-style: none;
            
        }
        img{
            display: block;
        }
        .sang_ilist{
            display: flex;
            margin: 8px;
        }
        .sang_ilist li{
            width:30%;
            flex-grow: 1;
            position: relative;
            margin-right: 3px;
        }
        .sang_ilist p{
            text-align: center;
            font-size: 14px;
            line-height: 33px;
            position:absolute;
            bottom:0;
            left:0;
            width:100%;
            background:rgba(0,0,0,.5);
            color:#fff;
            font-weight: bold;
        }
        .sang_ilist img{
            width:100%;
        }
    </style>
</head>
<body>
    <u1 class="sang_ilist">
        <li>
            <img src="./img/1.jpg" >
            <p>桑英锐的上图下文</p>

        </li>
        <li>
            <img src="./img/2.jpg" >
            <p>图片2</p>
        </li>
        <li>
            <img src="./img/3.jpg">
            <p>图片3</p>
        </li>
    </u1>
</body>
</html>
