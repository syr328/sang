<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桑英锐 - CSS3 3D动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            padding: 40px 20px;
            color: #fff;
        }

        .sang_header {
            text-align: center;
            margin-bottom: 50px;
        }

        .sang_header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #e94560, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .sang_header p {
            color: #a0a0b0;
            font-size: 1rem;
        }

        .sang_container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .sang_card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .sang_card h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #feca57;
            text-align: center;
        }

        .sang_card p {
            text-align: center;
            color: #a0a0b0;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .sang_perspective {
            perspective: 800px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .sang_box {
            width: 100px;
            height: 100px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .sang_rotate-x {
            background: linear-gradient(135deg, #e94560, #c23152);
            animation: sangRotateX 3s linear infinite;
        }

        .sang_rotate-y {
            background: linear-gradient(135deg, #0f3460, #16537e);
            animation: sangRotateY 3s linear infinite;
        }

        .sang_rotate-z {
            background: linear-gradient(135deg, #feca57, #ff9f43);
            animation: sangRotateZ 3s linear infinite;
        }

        .sang-translate {
            background: linear-gradient(135deg, #5f27cd, #341f97);
            animation: sangTranslate 2.5s ease-in-out infinite;
        }

        .sang-scale {
            background: linear-gradient(135deg, #00d2d3, #54a0ff);
            animation: sangScale 2s ease-in-out infinite;
        }

        .sang-cube-wrapper {
            perspective: 1000px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sang-cube {
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            animation: sangCubeRotate 4s linear infinite;
        }

        .sang-face {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .sang-front {
            background: linear-gradient(135deg, #e94560, #c23152);
            transform: translateZ(50px);
        }

        .sang-back {
            background: linear-gradient(135deg, #0f3460, #16537e);
            transform: rotateY(180deg) translateZ(50px);
        }

        .sang-right {
            background: linear-gradient(135deg, #feca57, #ff9f43);
            transform: rotateY(90deg) translateZ(50px);
        }

        .sang-left {
            background: linear-gradient(135deg, #5f27cd, #341f97);
            transform: rotateY(-90deg) translateZ(50px);
        }

        .sang-top {
            background: linear-gradient(135deg, #00d2d3, #54a0ff);
            transform: rotateX(90deg) translateZ(50px);
        }

        .sang-bottom {
            background: linear-gradient(135deg, #10ac84, #1dd1a1);
            transform: rotateX(-90deg) translateZ(50px);
        }

        .sang-carousel-wrapper {
            perspective: 1000px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sang-carousel {
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            animation: sangCarouselSpin 6s linear infinite;
        }

        .sang-panel {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            opacity: 0.85;
        }

        .sang-flip-wrapper {
            perspective: 800px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sang-flip {
            width: 150px;
            height: 150px;
            position: relative;
            transform-style: preserve-3d;
            animation: sangFlip 4s ease-in-out infinite;
        }

        .sang-flip-front,
        .sang-flip-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            backface-visibility: hidden;
        }

        .sang-flip-front {
            background: linear-gradient(135deg, #e94560, #c23152);
        }

        .sang-flip-back {
            background: linear-gradient(135deg, #0f3460, #16537e);
            transform: rotateY(180deg);
        }

        @keyframes sangRotateX {
            from { transform: rotateX(0deg); }
            to { transform: rotateX(360deg); }
        }

        @keyframes sangRotateY {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        @keyframes sangRotateZ {
            from { transform: rotateZ(0deg); }
            to { transform: rotateZ(360deg); }
        }

        @keyframes sangTranslate {
            0%, 100% { transform: translate3d(0, 0, 0); }
            25% { transform: translate3d(60px, 0, 0); }
            50% { transform: translate3d(60px, 60px, 0); }
            75% { transform: translate3d(0, 60px, 0); }
        }

        @keyframes sangScale {
            0%, 100% { transform: scale3d(1, 1, 1); }
            50% { transform: scale3d(1.3, 1.3, 1.3); }
        }

        @keyframes sangCubeRotate {
            from { transform: rotateX(-20deg) rotateY(0deg); }
            to { transform: rotateX(-20deg) rotateY(360deg); }
        }

        @keyframes sangCarouselSpin {
            from { transform: rotateX(-10deg) rotateY(0deg); }
            to { transform: rotateX(-10deg) rotateY(360deg); }
        }

        @keyframes sangFlip {
            0%, 100% { transform: rotateY(0deg); }
            50% { transform: rotateY(180deg); }
        }
    </style>
</head>
<body>
    <div class="sang_header">
        <h1>桑英锐 - CSS3 3D动画</h1>
        <p>CSS 3D Transforms 效果演示</p>
    </div>

    <div class="sang_container">
        <div class="sang_card">
            <h2>rotateX</h2>
            <div class="sang_perspective">
                <div class="sang_box sang_rotate-x">桑英锐</div>
            </div>
            <p>绕 X 轴旋转</p>
        </div>

        <div class="sang_card">
            <h2>rotateY</h2>
            <div class="sang_perspective">
                <div class="sang_box sang_rotate-y">桑英锐</div>
            </div>
            <p>绕 Y 轴旋转</p>
        </div>

        <div class="sang_card">
            <h2>rotateZ</h2>
            <div class="sang_perspective">
                <div class="sang_box sang_rotate-z">桑英锐</div>
            </div>
            <p>绕 Z 轴旋转</p>
        </div>

        <div class="sang_card">
            <h2>translate3d</h2>
            <div class="sang_perspective">
                <div class="sang_box sang-translate">桑英锐</div>
            </div>
            <p>3D 平移运动</p>
        </div>

        <div class="sang_card">
            <h2>scale3d</h2>
            <div class="sang_perspective">
                <div class="sang_box sang-scale">桑英锐</div>
            </div>
            <p>3D 缩放效果</p>
        </div>

        <div class="sang_card">
            <h2>3D 立方体</h2>
            <div class="sang_cube-wrapper">
                <div class="sang-cube">
                    <div class="sang-face sang-front">前</div>
                    <div class="sang-face sang-back">后</div>
                    <div class="sang-face sang-right">右</div>
                    <div class="sang-face sang-left">左</div>
                    <div class="sang-face sang-top">上</div>
                    <div class="sang-face sang-bottom">下</div>
                </div>
            </div>
            <p>transform-style: preserve-3d</p>
        </div>

        <div class="sang_card">
            <h2>3D 旋转木马</h2>
            <div class="sang-carousel-wrapper">
                <div class="sang-carousel">
                    <div class="sang-panel sang-front">1</div>
                    <div class="sang-panel sang-back">2</div>
                    <div class="sang-panel sang-right">3</div>
                    <div class="sang-panel sang-left">4</div>
                    <div class="sang-panel sang-top">5</div>
                    <div class="sang-panel sang-bottom">6</div>
                </div>
            </div>
            <p>多面板 3D 旋转</p>
        </div>

        <div class="sang_card">
            <h2>3D 翻转卡片</h2>
            <div class="sang-flip-wrapper">
                <div class="sang-flip">
                    <div class="sang-flip-front">正面</div>
                    <div class="sang-flip-back">背面</div>
                </div>
            </div>
            <p>backface-visibility: hidden</p>
        </div>
    </div>
</body>
</html>
