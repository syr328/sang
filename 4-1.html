<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2,h3,p{
            padding: 0;
            margin: 0;
        }
        #sang_box{
            width: 480px;
            padding: 8px;
            border: 1px solid #333;
            font-size: 12px;
            margin: 20px;
        }
        #sang_box h3{
            font-size: 16px;
            text-align: center;
            letter-spacing: 3px;
        }
        #sang_box p{
            line-height: 150%;
            color: #666;
            text-indent: 2em;
        }
        #sang_box a{
            color: #f11;
            text-decoration: none;
            font-weight: bold;
        }
        /* 新增样式 */
        .sang_stu-id{
            color: blue;
            font-weight: bold;
        }
        .sang_name{
            color: #555;
            font-weight: bold;
        }
        .sang_level{
            color: red;
            font-weight: bold;
        }
        .sang_knowledge{
            border:1px solid purple;
        }
    </style>
</head>
<body>
    <h2>css进阶</h2>
    <div id="sang_box">
        <h3>CSS那些事</h3>
        <p>
            学号：<span class="sang_stu-id">0212</span>，姓名：<span class="sang_name">桑英锐</span>，班级：计算机24008,对于《高级网页设计》课程的难度认知为：<span class="sang_level">适中</span>，
            这个例子的知识点是：<span class="sang_knowledge">群组选择器、后代选择器、层叠与继承。</span>
            <a href="#">更多>></a>
        </p>
    </div>
    <!--学号：蓝色加粗；姓名：深色加粗；难度值：红色加粗；知识点：紫色边框，边框为额外内容，使用内部css-->
</body>
</html>
