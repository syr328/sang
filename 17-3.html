<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桑英锐 - 商品列表</title>
  <link rel="stylesheet" href="font/iconfont.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", sans-serif;
      color: #24324a;
      background: linear-gradient(135deg, #e8f1ff, #fdfbff);
    }
    header {
      position: relative;
      padding: 56px 20px 60px;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #315caa, #2f8fb5);
    }
    header h1 { margin: 0 0 10px; font-size: 32px; }
    header p { margin: 0; opacity: .9; }
    .syr_back {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 8px 16px;
      color: white;
      text-decoration: none;
      border-radius: 999px;
      background: rgba(255,255,255,.18);
      transition: background .2s;
    }
    .syr_back:hover { background: rgba(255,255,255,.3); }
    main {
      width: min(960px, calc(100% - 32px));
      margin: -32px auto 40px;
    }
    section {
      margin-bottom: 22px;
      padding: 26px;
      background: rgba(255,255,255,.94);
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(43, 61, 105, .12);
    }
    h2 {
      margin: 0 0 6px;
      font-size: 20px;
      color: #315caa;
    }
    h2 .iconfont { margin-right: 8px; }
    .syr_api {
      margin: 0 0 20px;
      font-family: Consolas, monospace;
      font-size: 13px;
      color: #71809a;
      word-break: break-all;
    }
    .syr_api b { color: #2f7d6d; }

    /* 加载与错误 */
    .syr_loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 50px 0;
      color: #71809a;
      font-size: 14px;
    }
    .syr_spin {
      width: 38px;
      height: 38px;
      border: 4px solid #dde6f7;
      border-top-color: #315caa;
      border-radius: 50%;
      animation: syr_turn 0.9s linear infinite;
    }
    @keyframes syr_turn { to { transform: rotate(360deg); } }
    .syr_error {
      display: none;
      padding: 24px;
      font-size: 14px;
      line-height: 1.8;
      color: #c05050;
      border-radius: 12px;
      background: #fff5f5;
      border-left: 5px solid #e06c6c;
    }

    /* 商品卡片列表 */
    .syr_grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 16px;
    }
    a.syr_card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #e8eefb;
      border-radius: 14px;
      background: white;
      text-decoration: none;
      color: inherit;
      transition: transform .2s, box-shadow .2s;
      animation: syr_up .4s ease both;
    }
    a.syr_card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px rgba(43, 61, 105, .16);
    }
    @keyframes syr_up {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .syr_pic {
      position: relative;
      height: 160px;
      padding: 10px;
      background: white;
    }
    .syr_pic img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .syr_discount {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: bold;
      color: white;
      border-radius: 999px;
      background: #ff7043;
    }
    .syr_info {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 14px 14px;
      border-top: 1px solid #f0f3fa;
    }
    .syr_cat {
      align-self: flex-start;
      padding: 2px 10px;
      font-size: 11px;
      color: #4a6fc4;
      border-radius: 999px;
      background: #eaf1ff;
      margin-bottom: 8px;
    }
    .syr_name {
      font-size: 14px;
      font-weight: bold;
      line-height: 1.5;
      color: #333;
      margin-bottom: 6px;
      display: -webkit-box;
      line-clamp: 2;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .syr_bottom {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: auto;
    }
    .syr_price {
      font-size: 18px;
      font-weight: bold;
      color: #e64a19;
    }
    .syr_more {
      margin-left: auto;
      font-size: 12px;
      color: #8fa3c8;
    }
    a.syr_card:hover .syr_more { color: #315caa; }
    footer {
      padding: 24px;
      text-align: center;
      color: #71809a;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!--
    姓名：桑英锐
    日期：2026-11-02
    使用大模型：GLM-5.3-Flash
    功能名称：商品列表页（fetch 获取 8 件商品，点击进入详情页）
  -->
  <header>
    <a class="syr_back" href="index.html"><span class="iconfont icon-shouye"></span> 返回导航</a>
    <h1>商品列表</h1>
    <p>fetch 请求接口获取 8 件商品，点击卡片查看详情</p>
  </header>

  <main>
    <section>
      <h2><span class="iconfont icon-fenlei"></span>默认商品列表</h2>
      <p class="syr_api">接口地址：<b>https://dummyjson.com/products?limit=8</b></p>
      <div class="syr_loading" id="syr_loading">
        <div class="syr_spin"></div>
        正在请求接口数据，请稍候...
      </div>
      <div class="syr_error" id="syr_error"></div>
      <div class="syr_grid" id="syr_grid"></div>
    </section>
  </main>

  <footer>© 2026 桑英锐 · 高级网页设计课堂实践</footer>

  <script>
    var syr_grid = document.getElementById("syr_grid");
    var syr_loading = document.getElementById("syr_loading");
    var syr_errorEl = document.getElementById("syr_error");

    /* 请求商品列表 */
    fetch("https://dummyjson.com/products?limit=8")
      .then(function (syr_res) {
        if (!syr_res.ok) throw new Error("HTTP 状态码：" + syr_res.status);
        return syr_res.json();
      })
      .then(function (syr_data) {
        syr_loading.style.display = "none";
        syr_data.products.forEach(function (syr_p) {
          var syr_a = document.createElement("a");
          syr_a.className = "syr_card";
          /* 跳转到详情页，用问号传参把商品 id 带过去 */
          syr_a.href = "17-3-detail.html?id=" + syr_p.id;
          syr_a.innerHTML =
            '<div class="syr_pic">' +
              '<span class="syr_discount">-' + Math.round(syr_p.discountPercentage) + '%</span>' +
              '<img src="' + syr_p.thumbnail + '" alt="' + syr_p.title + '">' +
            '</div>' +
            '<div class="syr_info">' +
              '<span class="syr_cat">' + syr_p.category + '</span>' +
              '<div class="syr_name">' + syr_p.title + '</div>' +
              '<div class="syr_bottom">' +
                '<span class="syr_price">$' + syr_p.price.toFixed(2) + '</span>' +
                '<span class="syr_more">详情 &gt;</span>' +
              '</div>' +
            '</div>';
          syr_grid.appendChild(syr_a);
        });
      })
      .catch(function (syr_e) {
        syr_loading.style.display = "none";
        syr_errorEl.style.display = "block";
        syr_errorEl.textContent = "请求失败：" + syr_e.message + "\n请检查网络连接后刷新页面重试。";
      });
  </script>
</body>
</html>
