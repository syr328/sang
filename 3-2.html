<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>212 桑英锐</title>
    <style>
        p{
            color: aqua;
            font-size: 50px;
        }
        /*标签选择器*/
        #sang_box{
            width: 600px;
            height: 500px;
            background-color:#ccc;
        }
        .sang_n1{
            color: black;

        }
        .sang_n2{
            color: blueviolet;
        }
        .sang_n3{
            color: burlywood;
        }
        .sang_n4{
            color: aliceblue;
        }
        h2{
            background-color: black; /*黑色背景*/
            color: white; /*白色文字*/
        }
        .sang_box2{
            width: 300px;
            height: 300px;
            background-color:burlywood;
        }
    </style>
</head>
<body>
    <h2>层叠样式表 css</h2>
    <div class="sang_box2"></div>
    <div id="sang_box">
        <p>CSS<span class="sang_n4">选择器</span></p>
        <p><span class="sang_n1">桑</span><span class="sang_n2">英</span><span class="sang_n3">锐</span></p>
        <p>CSS属性</p>
    </div>
</body>
</html>
