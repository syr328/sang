<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桑英锐 - fetch 获取商品数据</title>
  <link rel="stylesheet" href="font/iconfont.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", sans-serif;
      color: #24324a;
      background: linear-gradient(135deg, #e8f1ff, #fdfbff);
    }
    header {
      position: relative;
      padding: 56px 20px 60px;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #315caa, #2f8fb5);
    }
    header h1 { margin: 0 0 10px; font-size: 32px; }
    header p { margin: 0; opacity: .9; }
    .syr_back {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 8px 16px;
      color: white;
      text-decoration: none;
      border-radius: 999px;
      background: rgba(255,255,255,.18);
      transition: background .2s;
    }
    .syr_back:hover { background: rgba(255,255,255,.3); }
    main {
      width: min(1100px, calc(100% - 32px));
      margin: -32px auto 40px;
    }
    section {
      margin-bottom: 22px;
      padding: 26px;
      background: rgba(255,255,255,.94);
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(43, 61, 105, .12);
    }
    h2 {
      margin: 0 0 18px;
      font-size: 20px;
      color: #315caa;
    }
    h2 .iconfont { margin-right: 8px; }

    /* ---------- 工具栏 ---------- */
    .syr_toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .syr_search {
      flex: 1;
      min-width: 200px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border: 2px solid #dde6f7;
      border-radius: 10px;
      background: #fbfcff;
    }
    .syr_search .iconfont { color: #8fa3c8; }
    .syr_search input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 14px;
      background: transparent;
      color: #333;
    }
    .syr_select {
      padding: 10px 14px;
      font-size: 14px;
      color: #333;
      border: 2px solid #dde6f7;
      border-radius: 10px;
      background: #fbfcff;
      outline: none;
    }
    .syr_reload {
      padding: 10px 18px;
      font-size: 14px;
      color: #315caa;
      border: 1px solid #c6d5f5;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .syr_reload:hover { background: #315caa; color: white; }
    .syr_stats {
      font-size: 13px;
      color: #71809a;
    }
    .syr_stats b { color: #315caa; }

    /* ---------- 加载与错误 ---------- */
    .syr_loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 50px 0;
      color: #71809a;
      font-size: 14px;
    }
    .syr_spin {
      width: 38px;
      height: 38px;
      border: 4px solid #dde6f7;
      border-top-color: #315caa;
      border-radius: 50%;
      animation: syr_turn 0.9s linear infinite;
    }
    @keyframes syr_turn { to { transform: rotate(360deg); } }
    .syr_error {
      display: none;
      padding: 24px;
      font-size: 14px;
      line-height: 1.8;
      color: #c05050;
      border-radius: 12px;
      background: #fff5f5;
      border-left: 5px solid #e06c6c;
    }

    /* ---------- 商品卡片 ---------- */
    .syr_grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .syr_card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #e8eefb;
      border-radius: 14px;
      background: white;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      animation: syr_up .4s ease both;
    }
    .syr_card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px rgba(43, 61, 105, .16);
    }
    @keyframes syr_up {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .syr_pic {
      position: relative;
      height: 170px;
      padding: 10px;
      background: white;
    }
    .syr_pic img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .syr_discount {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: bold;
      color: white;
      border-radius: 999px;
      background: #ff7043;
    }
    .syr_info {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 14px 14px;
      border-top: 1px solid #f0f3fa;
    }
    .syr_cat {
      align-self: flex-start;
      padding: 2px 10px;
      font-size: 11px;
      color: #4a6fc4;
      border-radius: 999px;
      background: #eaf1ff;
      margin-bottom: 8px;
    }
    .syr_name {
      font-size: 14px;
      font-weight: bold;
      line-height: 1.5;
      color: #333;
      margin-bottom: 6px;
      display: -webkit-box;
      line-clamp: 2;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .syr_rate {
      margin-bottom: 8px;
      font-size: 12px;
      color: #f5a623;
    }
    .syr_bottom {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: auto;
    }
    .syr_price {
      font-size: 18px;
      font-weight: bold;
      color: #e64a19;
    }
    .syr_stock {
      font-size: 11px;
      color: #9aa6bd;
      margin-left: auto;
    }

    /* ---------- 详情弹窗 ---------- */
    .syr_mask {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      padding: 20px;
      background: rgba(20, 28, 48, .55);
      overflow-y: auto;
    }
    .syr_modal {
      width: min(560px, 100%);
      margin: 40px auto;
      padding: 26px;
      border-radius: 18px;
      background: white;
      animation: syr_up .3s ease;
    }
    .syr_modal img {
      width: 100%;
      height: 240px;
      object-fit: contain;
      margin-bottom: 16px;
    }
    .syr_modal h3 { margin: 0 0 6px; font-size: 19px; color: #24324a; }
    .syr_modal .syr_rate { font-size: 13px; }
    .syr_modal p {
      font-size: 14px;
      line-height: 1.9;
      color: #5b6578;
      margin: 10px 0 0;
    }
    .syr_modal .syr_price { font-size: 24px; }
    .syr_close {
      margin-top: 18px;
      padding: 9px 22px;
      font-size: 14px;
      color: #315caa;
      border: 1px solid #c6d5f5;
      border-radius: 999px;
      background: white;
      cursor: pointer;
    }
    .syr_close:hover { background: #315caa; color: white; }
    footer {
      padding: 24px;
      text-align: center;
      color: #71809a;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!--
    姓名：桑英锐
    日期：2026-11-02
    使用大模型：GLM-5.3-Flash
    功能名称：fetch 获取 dummyjson 商品数据并展示
  -->
  <header>
    <a class="syr_back" href="index.html"><span class="iconfont icon-shouye"></span> 返回导航</a>
    <h1>fetch 获取网络商品数据</h1>
    <p>数据来源：https://dummyjson.com/products（跨域接口，fetch + 原生 JS 渲染）</p>
  </header>

  <main>
    <section>
      <h2><span class="iconfont icon-fenlei"></span>商品列表</h2>
      <div class="syr_toolbar">
        <div class="syr_search">
          <span class="iconfont icon-sousuo"></span>
          <input type="text" id="syr_search" placeholder="按商品名称或品牌搜索...">
        </div>
        <select class="syr_select" id="syr_cat">
          <option value="">全部分类</option>
        </select>
        <button class="syr_reload" id="syr_reload">重新请求</button>
        <span class="syr_stats" id="syr_stats"></span>
      </div>
      <div class="syr_loading" id="syr_loading">
        <div class="syr_spin"></div>
        正在请求接口数据，请稍候...
      </div>
      <div class="syr_error" id="syr_error"></div>
      <div class="syr_grid" id="syr_grid"></div>
    </section>
  </main>

  <!-- 商品详情弹窗 -->
  <div class="syr_mask" id="syr_mask">
    <div class="syr_modal" id="syr_modal"></div>
  </div>

  <footer>© 2026 桑英锐 · 高级网页设计课堂实践</footer>

  <script>
    var syr_api = "https://dummyjson.com/products?limit=0";
    var syr_products = [];   // 接口返回的全部商品
    var syr_grid = document.getElementById("syr_grid");
    var syr_loading = document.getElementById("syr_loading");
    var syr_errorEl = document.getElementById("syr_error");
    var syr_stats = document.getElementById("syr_stats");
    var syr_search = document.getElementById("syr_search");
    var syr_cat = document.getElementById("syr_cat");
    var syr_mask = document.getElementById("syr_mask");
    var syr_modal = document.getElementById("syr_modal");

    /* 请求接口 */
    function syr_fetch() {
      syr_loading.style.display = "flex";
      syr_errorEl.style.display = "none";
      syr_grid.innerHTML = "";

      fetch(syr_api)
        .then(function (syr_res) {
          if (!syr_res.ok) {
            throw new Error("HTTP 状态码：" + syr_res.status);
          }
          return syr_res.json();   // 响应体解析成 JSON
        })
        .then(function (syr_data) {
          syr_products = syr_data.products;
          syr_build_cats();
          syr_render();
          syr_loading.style.display = "none";
        })
        .catch(function (syr_e) {
          syr_loading.style.display = "none";
          syr_errorEl.style.display = "block";
          syr_errorEl.textContent = "请求失败：" + syr_e.message +
            "\n请检查网络连接后点击「重新请求」再试。";
        });
    }

    /* 生成分类下拉框 */
    function syr_build_cats() {
      var syr_seen = {};
      syr_cat.innerHTML = '<option value="">全部分类</option>';
      syr_products.forEach(function (syr_p) {
        if (!syr_seen[syr_p.category]) {
          syr_seen[syr_p.category] = true;
          var syr_opt = document.createElement("option");
          syr_opt.value = syr_p.category;
          syr_opt.textContent = syr_p.category;
          syr_cat.appendChild(syr_opt);
        }
      });
    }

    /* 渲染商品卡片（按搜索词和分类过滤） */
    function syr_render() {
      var syr_kw = syr_search.value.trim().toLowerCase();
      var syr_list = syr_products.filter(function (syr_p) {
        var syr_matchKw = !syr_kw ||
          syr_p.title.toLowerCase().indexOf(syr_kw) > -1 ||
          (syr_p.brand || "").toLowerCase().indexOf(syr_kw) > -1;
        var syr_matchCat = !syr_cat.value || syr_p.category === syr_cat.value;
        return syr_matchKw && syr_matchCat;
      });

      syr_stats.innerHTML = "共 <b>" + syr_products.length + "</b> 件商品，当前显示 <b>" + syr_list.length + "</b> 件";
      syr_grid.innerHTML = "";

      syr_list.forEach(function (syr_p) {
        var syr_card = document.createElement("div");
        syr_card.className = "syr_card";
        syr_card.innerHTML =
          '<div class="syr_pic">' +
            '<span class="syr_discount">-' + Math.round(syr_p.discountPercentage) + '%</span>' +
            '<img src="' + syr_p.thumbnail + '" alt="' + syr_p.title + '">' +
          '</div>' +
          '<div class="syr_info">' +
            '<span class="syr_cat">' + syr_p.category + '</span>' +
            '<div class="syr_name">' + syr_p.title + '</div>' +
            '<div class="syr_rate">★ ' + syr_p.rating.toFixed(1) + '</div>' +
            '<div class="syr_bottom">' +
              '<span class="syr_price">$' + syr_p.price.toFixed(2) + '</span>' +
              '<span class="syr_stock">库存 ' + syr_p.stock + '</span>' +
            '</div>' +
          '</div>';
        syr_card.onclick = function () { syr_show_detail(syr_p); };
        syr_grid.appendChild(syr_card);
      });

      if (syr_list.length === 0) {
        syr_grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#9aa6bd; padding:30px 0;">没有符合条件的产品</p>';
      }
    }

    /* 商品详情弹窗 */
    function syr_show_detail(syr_p) {
      syr_modal.innerHTML =
        '<img src="' + syr_p.thumbnail + '" alt="' + syr_p.title + '">' +
        '<h3>' + syr_p.title + '</h3>' +
        '<div class="syr_rate">★ ' + syr_p.rating.toFixed(1) +
          ' ｜ ' + (syr_p.brand || "无品牌") + ' ｜ ' + syr_p.category + '</div>' +
        '<p>' + syr_p.description + '</p>' +
        '<div class="syr_bottom" style="display:flex; align-items:baseline; gap:10px; margin-top:14px;">' +
          '<span class="syr_price">$' + syr_p.price.toFixed(2) + '</span>' +
          '<span class="syr_stock" style="font-size:12px; color:#9aa6bd;">原价 $' +
            (syr_p.price / (syr_p.discountPercentage / 100 + 1)).toFixed(2) +
            ' · 库存 ' + syr_p.stock + ' 件</span>' +
        '</div>' +
        '<button class="syr_close" id="syr_close">关闭</button>';
      syr_mask.style.display = "block";
      document.getElementById("syr_close").onclick = function () {
        syr_mask.style.display = "none";
      };
    }
    syr_mask.onclick = function (syr_e) {
      if (syr_e.target === syr_mask) syr_mask.style.display = "none";
    };

    /* 搜索 / 筛选 / 重新请求 */
    syr_search.oninput = syr_render;
    syr_cat.onchange = syr_render;
    document.getElementById("syr_reload").onclick = syr_fetch;

    syr_fetch();
  </script>
</body>
</html>
