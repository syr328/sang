<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桑英锐 - 数七游戏</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; }
    .syr_header { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 40px 20px; text-align: center; }
    .syr_header h1 { font-size: 32px; margin-bottom: 10px; }
    .syr_header p { font-size: 16px; opacity: 0.9; }
    .syr_container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .syr_rule { background: #fff; border-radius: 12px; padding: 20px 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 30px; font-size: 15px; line-height: 1.8; }
    .syr_rule strong { color: #764ba2; }
    .syr_grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; }
    .syr_box {
        aspect-ratio: 1 / 1;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: bold;
        color: #4776d0;
        transition: transform 0.2s;
    }
    .syr_box:hover { transform: translateY(-3px); }
    /* 满足数七规则（七的倍数或含数字7）的盒子：不显示数字 */
    .syr_box.syr_pass { background: #e3e6ec; box-shadow: none; color: transparent; }
    .syr_legend { display: flex; gap: 30px; margin-top: 25px; font-size: 14px; color: #666; }
    .syr_legend .syr_demo { display: inline-block; width: 20px; height: 20px; border-radius: 5px; vertical-align: -4px; margin-right: 6px; }
    .syr_demo_num { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
    .syr_demo_pass { background: #e3e6ec; }
    .syr_footer { text-align: center; padding: 30px; color: #999; font-size: 14px; }
</style>
</head>
<body>
<!--
  姓名：桑英锐
  日期：2026-10-26
  使用大模型：GLM-5.3-Flash
  功能名称：数七游戏（100个盒子）
-->
<div class="syr_header">
    <h1>数七游戏</h1>
    <p>1 ~ 100 一百个盒子 · 七的倍数或包含数字 7 的盒子不显示数字</p>
</div>

<div class="syr_container">
    <div class="syr_rule">
        <strong>游戏规则：</strong>从 1 数到 100，遇到 <strong>7 的倍数</strong>（7、14、21……）或<strong>包含数字 7</strong> 的数（7、17、27……）时不显示数字，其余盒子正常显示数字。
    </div>

    <div class="syr_grid" id="syr_grid"></div>

    <div class="syr_legend">
        <span><span class="syr_demo syr_demo_num"></span>正常数字</span>
        <span><span class="syr_demo syr_demo_pass"></span>逢七跳过（不显示）</span>
    </div>
</div>

<div class="syr_footer">桑英锐 - 数七游戏 | 判断条件：syr_i % 7 === 0 或 数值中包含字符 "7"</div>

<script>
    // 获取盒子容器
    var syr_grid = document.getElementById("syr_grid");

    // 循环生成 1 ~ 100 共一百个盒子
    for (var syr_i = 1; syr_i <= 100; syr_i++) {
        var syr_box = document.createElement("div");
        syr_box.className = "syr_box";

        // 数七规则：7 的倍数，或数字中包含 7
        var syr_str = String(syr_i);
        if (syr_i % 7 === 0 || syr_str.indexOf("7") !== -1) {
            // 满足规则：不显示数字
            syr_box.className += " syr_pass";
        } else {
            // 不满足规则：正常显示数字
            syr_box.innerHTML = syr_i;
        }
        syr_grid.appendChild(syr_box);
    }
</script>
</body>
</html>
