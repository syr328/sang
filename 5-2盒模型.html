<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型、框模型，box model</title>
    <style>
        body,h2,p,div{
            padding:0;
            margin:0;
        }
        #sang_a{
            width: 400px;
            height: 400px;
            border: 1px solid #039;
            padding: 50px 40px 30px 20px;/*上右下左*/
            margin: 40px auto;
        }
        #sang_b{
            width: 400px;
            height: 400px;
            border: 1px solid #039;
            margin: 50px auto 40px;
        }
        #sang_c{
            width: 400px;
            height: 400px;
            border: 1px solid #039;
            padding: 50px 40px 30px 20px;/*上右下左*/
            margin: 50px auto 40px;
        }
        #sang_d{
            width: 400px;
            height: 400px;
            border: 1px solid #039;
            padding: 50px 40px 30px 20px;/*上右下左*/
            margin: 50px auto 40px;
            box-sizing:border-box;
        }
    </style>
</head>
<body>
    <div id="sang_a">212桑英锐</div>
    <div id="sang_b">212桑英锐</div>
    <div id="sang_c">212桑英锐</div>
    <div id="sang_d">212桑英锐</div>


</body>
</html>
