<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: red;
            font-size: 100px;
        }
        .sang_text{
            color:blue;
        }
        #sang_text{
            color:purple;
        }
        .sang_box p{
            color:orange;
        }
        #sang_box #sang_text{
            color:silver;
        }
        .sang_text{
            color:yellow!important;
        }
        #sang_box{
            /*宽400，高200，灰色背景，距离，字间距5px*/
            width:400px;
            height:400px;
            background-color:gray;
            margin: 10px;
            letter-spacing:5px;
            /*圆角矩形50%*/
            border-radius:50%;
        }


    </style>

</head>
<body>
    <h2>层叠与继承</h2>
    <div id="sang_box" class="sang_box">
        <p id="sang_text" class="sang_text">212 桑英锐</p>
        <p>层叠与继承的优先级</p>
    </div>
</body>
</html>
