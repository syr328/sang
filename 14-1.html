<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>桑英锐的JavaScript</h2>
    <script>
        document.write("<h3>hello world,桑英锐</h3>");
        alert("hello world");
        console.log("hello world,桑英锐");
        //prompt和confirm方法
        var name = prompt("请输入您的姓名");
        console.log(name);
        var age = prompt("请确认是否年满18岁");
        console.log(age);
        var isConfirm = confirm("您确定要提交吗？");
        if(isConfirm){
            console.log("您确认提交");
        }else{
            console.log("您取消提交");
        }
        console.log(isConfirm);
    </script>
</body>
</html>=
